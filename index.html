<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STARK50 — Hälsa & styrka efter 50</title>
<meta name="description" content="Träning, mat, sömn och återhämtning byggt för män 50+. Viktnedgång och kroppssammansättning med modern forskning.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STARK50">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Typsnitten laddas utan att blockera: en vanlig stylesheet-länk håller tillbaka
     app.js tills Google svarat, och på dåligt nät blir appen då en tom skärm i
     flera sekunder. media="print" gör länken oblockerande; onload växlar den till
     att gälla på riktigt. Fallback-typsnitten i styles.css visas under tiden. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Karla:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Karla:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══════════════ ONBOARDING ══════════════ -->
<div id="onboarding" class="onboarding hidden">
  <div class="ob-grain"></div>
  <div class="ob-inner" id="obInner"></div>
</div>

<!-- ══════════════ HUVUDAPP ══════════════ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">STARK<span>50</span></div>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-view="idag"><span class="nav-ico">◉</span>Idag</button>
      <button class="nav-btn" data-view="mat"><span class="nav-ico">✦</span>Mat</button>
      <button class="nav-btn" data-view="traning"><span class="nav-ico">▲</span>Träning</button>
      <button class="nav-btn" data-view="recept"><span class="nav-ico">❖</span>Recept</button>
      <button class="nav-btn" data-view="sinne"><span class="nav-ico">◐</span>Sinne</button>
      <button class="nav-btn" data-view="mal"><span class="nav-ico">◎</span>Mål</button>
    </nav>
    <button class="nav-btn nav-settings" data-view="installningar"><span class="nav-ico">⚙</span>Inställningar</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="topbar-date" id="topbarDate"></div>
        <h1 class="topbar-title" id="topbarTitle">Idag</h1>
      </div>
      <div class="topbar-user" id="topbarUser"></div>
    </header>
    <div class="view-wrap" id="viewWrap"></div>
  </main>
</div>

<!-- Toast-container för påminnelser -->
<div class="toasts" id="toasts"></div>

<!-- Modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
      if (!reg) return;
      // En hemskärms-PWA "startar" genom att bli synlig igen. Det är då vi vill
      // fråga efter ny kod — Safari gör det annars som mest en gång per dygn.
      const check = () => reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
      check();
      // Ny version färdiginstallerad bredvid den som kör: säg till, ladda inte om
      // under fingrarna på någon som loggar set mitt i ett pass.
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", () => {
          if (sw.state === "installed" && navigator.serviceWorker.controller && window.onAppUpdate) window.onAppUpdate();
        });
      });
    }).catch(() => {}));
  }
</script>
</body>
</html>
